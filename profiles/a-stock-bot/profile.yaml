name: a-stock-bot
description: A 股专业 Bot，复用共享执行核；Paper 审批下单，禁止直接下单与持有券商密钥
market: A_SHARE
primary_tools:
  - query_health
  - query_positions
  - query_signals
  - preview_order
  - query_approvals
  - query_order_status
  - query_accounts
  - submit_order
prohibited:
  - direct_order
  - withdrawal
  - access_credentials
  - decide_approval
