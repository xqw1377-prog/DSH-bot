# 24 币白名单来自 6celue DEFAULT_SYMBOLS_ORDER，DSH 只复制清单，不导入 6celue 代码。
# 采集优先级：官方 API > RSS/数据接口 > 静态 HTML 增量 > Playwright（本服务禁用）。
# X 必须走 Filtered Stream；没有 X_BEARER_TOKEN 则保持 disabled。
# 美股行情：Shadow MVP 只用授权延迟/IEX，不上完整 SIP，不爬 Yahoo/Google。

version: 1
universe_source: "6celue.engine.coin_registry.DEFAULT_SYMBOLS_ORDER"
us_market:
  tier: delayed_iex
  provider: alpaca
  enabled: false
  requires: [ALPACA_API_KEY, ALPACA_SECRET_KEY]
  note: Shadow/Paper 复盘用不需要完整实时全市场。开通密钥后再 enable。

