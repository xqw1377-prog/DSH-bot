sources:
  - id: sec-current-filings
    market: US
    tier: PRIMARY
    method: SEC_EDGAR
    enabled: true
    url: https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&owner=include&count=40&output=atom
    assets: []
    event_types: [US_MARKET_SPILLOVER, EARNINGS, REGULATORY_ACTION]
    note: data.sec.gov / EDGAR Atom。必须带 User-Agent，不超过 10 req/s。

  - id: nasdaq-trade-halts
    market: US
    tier: PRIMARY
    method: NASDAQ_HALT_RSS
    enabled: true
    url: https://www.nasdaqtrader.com/rss.aspx?feed=tradehalts
    assets: []
    event_types: [TRADE_HALT, US_MARKET_SPILLOVER]
    min_interval_seconds: 60

  - id: gov-cn-policy
    market: A_SHARE
    tier: PRIMARY
    method: HTML_INCREMENTAL
    enabled: true
    url: https://www.gov.cn/zhengce/zhengceku/gwywj/home.htm
    allow_path_prefixes: ["/zhengce/", "/lianbo/", "/xinwen/"]
    assets: []
    event_types: [INDUSTRY_POLICY, MONETARY_POLICY]
    min_interval_seconds: 3

  - id: pbc-news
    market: A_SHARE
    tier: PRIMARY
    method: HTML_INCREMENTAL
    enabled: true
    url: https://www.pbc.gov.cn/goutongjiaoliu/113456/113469/index.html
    allow_path_prefixes: ["/goutongjiaoliu/", "/zhengcehuobisi/"]
    assets: []
    event_types: [MONETARY_POLICY, FX_SHOCK]
    min_interval_seconds: 3

  - id: csrc-news
    market: A_SHARE
    tier: PRIMARY
    method: HTML_INCREMENTAL
    enabled: true
    url: https://www.csrc.gov.cn/csrc/c100028/common_list.shtml
    allow_path_prefixes: ["/csrc/"]
    assets: []
    event_types: [REGULATORY_ACTION]
    min_interval_seconds: 3

  - id: ndrc-docs
    market: A_SHARE
    tier: PRIMARY
    method: HTML_INCREMENTAL
    enabled: true
    url: https://www.ndrc.gov.cn/xxgk/zcfb/
    allow_path_prefixes: ["/xxgk/"]
    assets: []
    event_types: [INDUSTRY_POLICY]
    min_interval_seconds: 3

  - id: cninfo-announcements
    market: A_SHARE
    tier: PRIMARY
    method: CNINFO_API
    enabled: false
    url: https://www.cninfo.com.cn/
    requires: [CNINFO_API_TOKEN]
    note: 法定信披。正式使用申请授权接口，不长期逆向网页。

  - id: alpaca-us-quotes
    market: US
    tier: SECONDARY
    method: ALPACA_MARKET_DATA
    enabled: false
    url: https://data.alpaca.markets
    requires: [ALPACA_API_KEY, ALPACA_SECRET_KEY]
    note: 免费层主要是 IEX 延迟/部分覆盖。

  - id: x-filtered-stream
    market: CRYPTO
    tier: PRIMARY
    method: X_FILTERED_STREAM
    enabled: false
    url: https://api.x.com/2/tweets/search/stream
    requires: [X_BEARER_TOKEN]
    note: 按白名单 from:official / from:founder 建规则。断线用 Recent Search 补 7 天。禁止 Playwright 登录抓时间线。
