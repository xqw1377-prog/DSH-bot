[project]
name = "risk-policy"
version = "0.1.0"
description = "DSH Bot 全局风险预算与策略服务"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
