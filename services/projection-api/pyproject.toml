[project]
name = "projection-api"
version = "0.1.0"
description = "DSH Bot 面向前端的只读投影服务"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.111,<1", "uvicorn[standard]>=0.30,<1", "prometheus_client>=0.20", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
