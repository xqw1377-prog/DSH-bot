[project]
name = "dsh-snapshot-bridge"
version = "0.1.0"
description = "双量化系统只读快照桥：导出账户/持仓到 DSH Snapshot，不下单"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "jsonschema>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
