version: "3.9"

services:
  quant-gateway:
    build:
      context: ../..
      dockerfile: infra/containers/services/quant-gateway.Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app/packages/domain-contracts/src:/app/services/quant-gateway/src
      - QUANT_GATEWAY_DB=/data/gateway.db
      - DSH_ENV=production
      # 二次硬风控：容器内不能用 127.0.0.1，必须指向 risk-policy 服务名
      - RISK_POLICY_URL=http://risk-policy:8003
      # 生产必须配置 API key，否则网关拒绝启动：
      # QUANT_GATEWAY_API_KEYS="key/name:read,write;..."
      # 只读快照（Shadow 数据源，不是第三种交易所）：
      # QUANT_GATEWAY_SNAPSHOT_DIR=/data/snapshots
      # QUANT_GATEWAY_READ_ONLY=1
      # QUANT_GATEWAY_PUBLIC_TICKER_URL=https://api.binance.com/api/v3/ticker/price?symbol={symbol}
    volumes:
      - gateway-data:/data
    networks:
      - dsh

  strategy-evolution:
    build:
      context: ../..
      dockerfile: infra/containers/services/strategy-evolution.Dockerfile
    ports:
      - "8002:8002"
    environment:
      - STRATEGY_EVOLUTION_AUDITOR_URL=http://risk-auditor:8005
    depends_on:
      - risk-auditor
    networks:
      - dsh

  risk-auditor:
    build:
      context: ../..
      dockerfile: infra/containers/services/risk-auditor.Dockerfile
    ports:
      - "8005:8005"
    environment:
      - RISK_AUDITOR_DB=/data/auditor.db
    volumes:
      - auditor-data:/data
    networks:
      - dsh

  risk-policy:
    build:
      context: ../..
      dockerfile: infra/containers/services/risk-policy.Dockerfile
    ports:
      - "8003:8003"
    networks:
      - dsh

  projection-api:
    build:
      context: ../..
      dockerfile: infra/containers/services/projection-api.Dockerfile
    ports:
      - "8004:8004"
    environment:
      - QUANT_GATEWAY_URL=http://quant-gateway:8001
      # 策略实验/候选代理：容器内必须指向 strategy-evolution 服务名
      - STRATEGY_EVOLUTION_URL=http://strategy-evolution:8002
      - QUANT_GATEWAY_API_KEY=${QUANT_GATEWAY_API_KEY:-}
      - PROJECTION_API_KEY=${PROJECTION_API_KEY:-}
      - DSH_RUNTIME_DB=/data/runtime.db
    volumes:
      - runtime-data:/data
    depends_on:
      - quant-gateway
    networks:
      - dsh

  incident-center:
    build:
      context: ../..
      dockerfile: infra/containers/services/incident-center.Dockerfile
    ports:
      - "8006:8006"
    networks:
      - dsh

  intelligence-ingest:
    build:
      context: ../..
      dockerfile: infra/containers/services/intelligence-ingest.Dockerfile
    ports:
      - "8007:8007"
    environment:
      - INTELLIGENCE_DB=/data/intelligence.db
      - QUANT_GATEWAY_SNAPSHOT_DIR=/data/snapshots
      - INTELLIGENCE_INGEST_API_KEYS=${INTELLIGENCE_INGEST_API_KEYS:-}
      - DSH_ENV=production
    volumes:
      - intel-data:/data
    networks:
      - dsh

  dsh-bot-web:
    build:
      context: ../..
      dockerfile: infra/containers/apps/dsh-bot-web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PROJECTION_API_URL=http://projection-api:8004
      - PROJECTION_API_KEY=${PROJECTION_API_KEY:-}
      - QUANT_GATEWAY_URL=http://quant-gateway:8001
      - QUANT_GATEWAY_API_KEY=${QUANT_GATEWAY_API_KEY:-}
      - DSH_ENV=production
      # 生产写 BFF 必须注入会话身份，否则审批/紧急停止 503：
      # - DSH_SESSION_USER=
      # - DSH_WEB_ORIGIN=https://bot.example.com
    depends_on:
      - projection-api
    networks:
      - dsh

networks:
  dsh:
    driver: bridge

volumes:
  gateway-data:
  intel-data:
  runtime-data:
  auditor-data:
