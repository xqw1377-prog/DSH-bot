[project]
name = "dsh-gateway-client"
version = "0.1.0"
description = "DSH 插件侧的 Quant Gateway 客户端：所有 Bot 访问量化系统的唯一通道"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "dsh-contracts"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
