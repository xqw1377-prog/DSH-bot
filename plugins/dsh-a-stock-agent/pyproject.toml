[project]
name = "dsh-a-stock-agent"
version = "0.1.0"
description = "A 股 Bot：复用 TradeExecutionCore 的 Paper 闭环，不含未审计 LLM"
requires-python = ">=3.12"
dependencies = ["dsh-gateway-client", "dsh-trade-approval", "dsh-contracts", "dsh-runtime"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
