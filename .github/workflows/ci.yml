name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          PKGS=$(find packages services plugins -name pyproject.toml \
            -exec dirname {} \; | sed 's/^/-e /' | tr '\n' ' ')
          pip install $PKGS pytest
      - name: Schema compatibility check
        run: python scripts/check_schemas.py
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check services packages plugins scripts
      - name: Type check (mypy, contracts first)
        run: |
          pip install mypy
          mypy
      - name: Tests
        run: pytest services/ plugins/ packages/ -q --tb=short -ra --import-mode=importlib

  smoke:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          PKGS=$(find packages services plugins -name pyproject.toml \
            -exec dirname {} \; | sed 's/^/-e /' | tr '\n' ' ')
          pip install $PKGS pytest
      - name: Prepare local env
        run: |
          cp .env.local.example .env.local
          chmod +x scripts/smoke_p0.sh scripts/start-local.sh scripts/start-backends.sh \
            scripts/check_start_backends.sh scripts/smoke_shadow_snapshot.sh
      - name: Production start script refusals
        run: bash scripts/check_start_backends.sh
      - name: Process-level P0 smoke
        run: bash scripts/smoke_p0.sh
      - name: Dual-quant readonly snapshot acceptance (pytest)
        run: |
          pytest packages/dsh-snapshot-bridge \
            services/quant-gateway/tests/test_snapshot_adapter.py \
            services/quant-gateway/tests/test_snapshot_readonly_gate.py \
            services/projection-api/tests/test_projection.py \
            packages/dsh-runtime/tests/test_market_closed.py -q --tb=short
      - name: Dual-quant readonly snapshot acceptance (smoke)
        run: bash scripts/smoke_shadow_snapshot.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          pnpm --filter @dsh-bot/client-sdk build
          pnpm -r lint
      - name: Test
        run: pnpm --filter dsh-bot-web test
      - name: Build
        run: |
          pnpm --filter @dsh-bot/client-sdk build
          pnpm --filter dsh-bot-web build
